<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co-Presenter · console</title>
<link rel="stylesheet" href="./console.css">
</head>
<body>

<!-- The operator's window. Open this beside the stage, on the laptop screen, while
     the room watches the projector. Everything here used to be a terminal line. -->
<header>
  <h1>Co-Presenter <span>console</span></h1>
  <div class="head-right">
    <span id="conn" class="pill bad">connecting…</span>
    <button id="listen" class="btn primary">Stop</button>
  </div>
</header>

<section id="vitals" class="vitals">
  <div class="vital" id="v-ear">
    <b>Ear</b><span class="val">—</span><span class="sub"></span>
  </div>
  <div class="vital" id="v-brain">
    <b>Brain</b><span class="val">—</span><span class="sub"></span>
  </div>
  <div class="vital" id="v-audio">
    <b>Audio queue</b><span class="val">—</span><span class="sub"></span>
  </div>
  <div class="vital" id="v-loop">
    <b>Loop lag</b><span class="val">—</span><span class="sub"></span>
  </div>
  <div class="vital" id="v-stage">
    <b>On screen</b><span class="val">—</span><span class="sub"></span>
  </div>
</section>

<section id="counts" class="counts"></section>

<main>
  <section class="pane">
    <div class="pane-head">
      <h2>Why it did or didn't draw</h2>
      <div class="filters" id="filters">
        <button data-f="all" class="on">All</button>
        <button data-f="problems">Problems</button>
        <button data-f="mic">mic</button>
        <button data-f="ear">ear</button>
        <button data-f="brain">brain</button>
        <button data-f="tool">tool</button>
        <button data-f="asset">asset</button>
      </div>
    </div>
    <div id="log" class="log">
      <div class="empty">Nothing yet. Traces appear here the moment audio arrives.</div>
    </div>
  </section>

  <aside class="side">
    <section class="pane">
      <div class="pane-head"><h2>Heard</h2></div>
      <div id="caption" class="caption">—</div>
      <div id="heard" class="heard"></div>
    </section>

    <section class="pane">
      <div class="pane-head"><h2>Microphones</h2></div>
      <div id="mics" class="mics"></div>
      <label class="gate">
        <span>Sensitivity <b id="gate-val">—</b></span>
        <input id="gate" type="range" min="0" max="0.08" step="0.001">
        <em>Left if it misses you · right if it draws on room noise</em>
      </label>
    </section>

    <section class="pane">
      <div class="pane-head"><h2>Controls</h2></div>
      <div class="controls">
        <button class="btn" data-act="clear">Clear the board</button>
        <button class="btn" data-act="undo">Undo last block</button>
        <button class="btn warn" data-act="context_reset">Reset everything</button>
        <button class="btn" data-act="health_refresh">Refresh vitals</button>
      </div>
      <div id="inputs" class="inputs"></div>
    </section>
  </aside>
</main>

<script src="./console.js"></script>
</body>
</html>
