<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co-Presenter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false, securityLevel: "loose", theme: "base",
    fontFamily: "Google Sans, Roboto, sans-serif",
    themeVariables: {
      primaryColor: "rgba(111,168,255,.18)", primaryTextColor: "#EAF2FF",
      primaryBorderColor: "#6FA8FF", lineColor: "#8FB4E8",
      secondaryColor: "rgba(255,122,110,.18)", tertiaryColor: "rgba(91,208,124,.18)",
      background: "transparent", mainBkg: "rgba(111,168,255,.18)", fontSize: "16px"
    }
  });
  window.mermaid = mermaid;
  window.dispatchEvent(new Event("mermaid-ready"));
</script>

<link rel="stylesheet" href="./stage.css">
<link rel="stylesheet" href="./dock.css">
</head>
<body>

  <!-- drifting light field -->
  <div id="sky"><b></b><b></b><b></b></div>
  <div id="grain"></div>

  <!-- where scenes live -->
  <div id="stage"><div id="slots" data-n="1"></div></div>

  <!-- nothing said yet -->
  <div id="idle"><span class="core-dots"><i></i><i></i><i></i><i></i></span></div>

  <!-- source: live mic vs self-contained demo replay -->
  <div id="src-toggle" class="src-toggle">
    <button data-mode="live"><span class="msym">graphic_eq</span>Live</button>
    <button data-mode="demo"><span class="msym">play_circle</span>Demo</button>
  </div>

  <!-- the only persistent chrome -->
  <div id="hud">
    <span id="dots" class="core-dots"><i></i><i></i><i></i><i></i></span>
    <span id="caption"></span>
  </div>

  <div id="dock" class="dock">
    <div class="dock-row" id="mic-row"></div>
    <div class="dock-sep"></div>
    <button id="add-mic" class="dock-btn" title="Add a microphone (up to 4)">
      <span class="msym">add</span><span>Mic</span>
    </button>
    <button id="phone-btn" class="dock-btn" title="Join a phone as a microphone">
      <span class="msym">qr_code_2</span><span>Phone</span>
    </button>
    <button id="listen-btn" class="dock-btn"
            title="Transcribe in this browser (no mic setup needed)">
      <span class="msym">record_voice_over</span><span>Listen</span>
    </button>
    <button id="cam-btn" class="dock-btn" title="Toggle camera">
      <span class="msym">videocam_off</span><span>Camera</span>
    </button>
    <div class="dock-sep"></div>
    <button id="notes-btn" class="dock-btn" title="The running record of this talk (N)">
      <span class="msym">sticky_note_2</span><span>Notes</span>
    </button>
    <button id="reset-btn" class="dock-btn ghost"
            title="Clear the board AND the running record — start the talk over">
      <span class="msym">restart_alt</span>
    </button>
    <button id="brain-btn" class="dock-btn ghost"
            title="Let gemini-3.7-flash decide what to draw, instead of the live ear">
      <span class="msym">neurology</span>
    </button>
    <button id="clear-btn" class="dock-btn" title="Clear (C)">
      <span class="msym">ink_eraser</span>
    </button>
    <button id="full-btn" class="dock-btn" title="Fullscreen (F)">
      <span class="msym">fullscreen</span>
    </button>
    <button id="hide-btn" class="dock-btn" title="Hide the controls (H brings them back)">
      <span class="msym">visibility_off</span>
    </button>
  </div>

  <!-- The way back when the controls are hidden. Fades in on any mouse
       movement, fades out again when the room is still, so it is
       discoverable without becoming permanent chrome. -->
  <button id="reveal" class="reveal" title="Show controls (H)">
    <span class="msym">expand_less</span><span>Controls</span>
  </button>

  <div id="cam-wrap" class="cam-wrap"><video id="cam" autoplay muted playsinline></video></div>

  <div id="notes" class="picker"><div class="picker-card notes-card">
    <div class="notes-head">
      <div class="picker-title" style="margin:0">The record so far</div>
      <span id="notes-age" class="notes-age"></span>
    </div>
    <div id="notes-thread" class="notes-thread"></div>
    <div id="notes-body" class="notes-body"></div>
    <button id="notes-close" class="picker-cancel">Done</button>
  </div></div>

  <div id="phone" class="picker"><div class="picker-card phone-card">
    <div class="picker-title">Join a phone as a microphone</div>
    <div class="phone-body">
      <div id="phone-qr" class="phone-qr"></div>
      <div class="phone-side">
        <div class="phone-step"><b>1</b> Same Wi-Fi as this Mac</div>
        <div class="phone-step"><b>2</b> Scan, or open the link below</div>
        <div class="phone-step"><b>3</b> Accept the certificate warning once</div>
        <a id="phone-url" class="phone-url" target="_blank" rel="noreferrer"></a>
        <div id="phone-live" class="phone-live"></div>
        <div class="gate-row">
          <div class="gate-head">
            <span>Sensitivity</span>
            <span id="gate-val" class="gate-val"></span>
          </div>
          <!-- live level behind the handle: set it while talking and you can see
               exactly where your voice sits against the threshold -->
          <div class="gate-meter"><i id="gate-level"></i><b id="gate-mark"></b></div>
          <input id="gate" class="gate-slider" type="range"
                 min="0" max="0.08" step="0.001">
          <div class="gate-hint">Drag left if it misses you · right if it draws on
            room noise</div>
        </div>
      </div>
    </div>
    <button id="phone-close" class="picker-cancel">Done</button>
  </div></div>

  <div id="picker" class="picker"><div class="picker-card">
    <div class="picker-title">Choose a microphone</div>
    <div id="picker-list"></div>
    <button id="picker-cancel" class="picker-cancel">Cancel</button>
  </div></div>

  <!-- optional, gitignored: supplies window.MAPS_KEY. See local.example.js -->
  <script src="./local.js" onerror="void 0"></script>
  <script src="./stage.js"></script>
  <script src="./dock.js"></script>
</body>
</html>
